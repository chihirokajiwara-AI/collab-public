name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collab-electron
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: TypeScript typecheck
        run: bunx tsc --build --noEmit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collab-electron
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: >
          bun test
          packages/shared
          packages/components
          src/main/import-service.test.ts
          src/main/files.test.ts
          src/main/file-filter.test.ts
          src/main/sidecar/ring-buffer.test.ts
          src/main/updater
          src/windows/shell/src/panel-manager.test.ts
          src/windows/shell/src/tile-renderer.test.ts
          src/windows/shell/src/webview-factory.test.ts

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collab-electron
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build
        run: bun run build
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=8192
